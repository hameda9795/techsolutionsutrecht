<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Overzicht van de startprijzen voor een website, webshop en websiteonderhoud.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#651FFF"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="600" y="100" text-anchor="middle" fill="#F0F6FC" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700">Kostenoverzicht Website</text>
  <rect x="120" y="180" width="300" height="320" rx="16" fill="#1C2128" stroke="#30363D" stroke-width="2"/>
  <rect x="160" y="220" width="220" height="140" rx="12" fill="url(#card1)" opacity="0.2"/>
  <text x="270" y="280" text-anchor="middle" fill="#FF8A65" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700">€250</text>
  <text x="270" y="330" text-anchor="middle" fill="#F0F6FC" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600">Website</text>
  <text x="270" y="360" text-anchor="middle" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="16">Complete bedrijfswebsite</text>
  <rect x="450" y="180" width="300" height="320" rx="16" fill="#1C2128" stroke="#30363D" stroke-width="2"/>
